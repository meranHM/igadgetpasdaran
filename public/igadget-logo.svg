<svg width="1254" height="1254" viewBox="0 0 1254 1254" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>آی گجت Logo</title>
  <desc>Vector SVG version of the AI Gadget logo with centered Farsi text.</desc>

  <defs>
    <radialGradient id="red-bg" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#ff3034"/>
      <stop offset="58%" stop-color="#ef1a24"/>
      <stop offset="100%" stop-color="#e6151e"/>
    </radialGradient>

    <linearGradient id="robot-fill" x1="514" y1="405" x2="728" y2="747" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#202326"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="145%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="11" stdDeviation="11" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1254" height="1254" fill="url(#red-bg)"/>

  <circle
    cx="627"
    cy="627"
    r="480"
    stroke="#000000"
    stroke-width="38"
  />

  <g filter="url(#soft-shadow)">
    <!-- Head -->
    <rect x="529" y="401" width="198" height="141" rx="9" fill="url(#robot-fill)"/>

    <!-- Eyes -->
    <rect x="568" y="427" width="47" height="90" rx="24" fill="#fb2b31"/>
    <rect x="644" y="427" width="47" height="90" rx="24" fill="#fb2b31"/>

    <!-- Neck and shoulders -->
    <rect x="606" y="539" width="28" height="79" rx="6" fill="url(#robot-fill)"/>
    <rect x="568" y="561" width="117" height="40" rx="20" fill="url(#robot-fill)"/>
    <rect x="592" y="541" width="63" height="19" rx="6" fill="url(#robot-fill)"/>

    <!-- Body -->
    <path d="M592 617H662V657C662 666 655 673 646 673H608C599 673 592 666 592 657V617Z" fill="url(#robot-fill)"/>

    <!-- Arms -->
    <path
      d="M572 582H558C548.06 582 538.52 585.95 531.49 592.99C524.45 600.02 520.5 609.56 520.5 619.5V646"
      stroke="url(#robot-fill)"
      stroke-width="15"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M684 582H698C707.94 582 717.48 585.95 724.51 592.99C731.55 600.02 735.5 609.56 735.5 619.5V646"
      stroke="url(#robot-fill)"
      stroke-width="15"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="537" cy="664" r="21" fill="url(#robot-fill)"/>
    <circle cx="719" cy="664" r="21" fill="url(#robot-fill)"/>

    <!-- Legs and feet -->
    <path d="M606 661H630L596 739H557C547.06 739 539 730.94 539 721C539 710.51 545.78 701.23 555.78 698.04L584 689L606 661Z" fill="url(#robot-fill)"/>
    <path d="M648 661H624L656 739H696C705.94 739 714 730.94 714 721C714 710.51 707.22 701.23 697.22 698.04L669 689L648 661Z" fill="url(#robot-fill)"/>
  </g>

  <!-- Centered Farsi wordmark. The two colors are split to match the source image. -->
  <g
    aria-label="آی گجت"
    font-family="Vazirmatn, IRANSans, 'Noto Sans Arabic', Tahoma, Arial, sans-serif"
    font-size="92"
    font-weight="900"
    letter-spacing="-1"
    text-anchor="middle"
    dominant-baseline="middle"
    filter="url(#soft-shadow)"
  >
    <text x="569" y="850" fill="#000000">گجت</text>
    <text x="744" y="850" fill="#ffffff">آی</text>
  </g>
</svg>
